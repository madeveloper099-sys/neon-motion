
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Motion | Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
      color: white;
    }

    .scene {
      text-align: center;
      position: relative;
    }

    .orb {
      width: 150px;
      height: 150px;
      margin: 0 auto 35px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 30%,
        #ffffff,
        #ff9a3c 15%,
        #ff4d00 40%,
        #4d00ff 75%,
        #050505
      );
      box-shadow:
        0 0 30px #ff5e00,
        0 0 70px #ff3c00,
        0 0 120px #6500ff;
      animation: float 3s ease-in-out infinite,
                 glow 2s ease-in-out infinite alternate;
    }

    h1 {
      font-size: clamp(32px, 7vw, 58px);
      letter-spacing: 5px;
      background: linear-gradient(90deg, #ff7a18, #ffffff, #9b5cff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      color: #999;
      margin-top: 14px;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .ring {
      position: absolute;
      width: 230px;
      height: 230px;
      top: -40px;
      left: 50%;
      border: 1px solid #ff6a2544;
      border-radius: 50%;
      transform: translateX(-50%);
      animation: rotate 8s linear infinite;
    }

    .ring::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff7a18;
      border-radius: 50%;
      top: 25px;
      left: 35px;
      box-shadow: 0 0 20px #ff7a18;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    @keyframes glow {
      from { filter: brightness(0.85); }
      to { filter: brightness(1.3); }
    }

    @keyframes rotate {
      to { transform: translateX(-50%) rotate(360deg); }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="ring"></div>
    <div class="orb"></div>
    <h1>NEON MOTION</h1>
    <p>CREATIVE CODE. INFINITE MOTION.</p>
  </main>
</body>
</html>
